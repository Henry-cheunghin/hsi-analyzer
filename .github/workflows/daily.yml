name: 恆指期權未平倉全自動判市與網頁更新

on:
  schedule:
    # 逢星期一至五，香港時間每晚 23:15 自動執行 (UTC 15:15)
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊測試

permissions:
  contents: write # 允許自動提交更新後的數據回 GitHub

jobs:
  analyze_and_auto_update:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載倉庫代碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝相依套件
        run: |
          pip install requests

      - name: 4. 自動抓取最新行情、期權鏈並推播 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "analyzer.py" ]; then
            python analyzer.py
          elif [ -f "HSI analyzer/analyzer.py" ]; then
            python "HSI analyzer/analyzer.py"
          else
            python "$(find . -name 'analyzer.py' | head -n 1)"
          fi

      - name: 5. 全自動提交最新數據至 GitHub 網頁
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json || true
          git diff --staged --quiet || (git commit -m "🤖 自動更新恆指期權最新數據與收市價 [skip ci]" && git push)
